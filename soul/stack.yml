# Production stack: a Git-backed Portainer stack on the NAS Portainer (endpoint 11
# = NUC). CI builds the image on push to main and fires the stack webhook.
#
# No env_file: Portainer Git stacks can't read one, so every env key is listed
# below as ${KEY:-} and its value lives in the stack Env. This list must match
# production's keys exactly: ${KEY:-} sets a key with no value to "", which is
# not always the same as unset. soul/README.md has the comparison command.
#
# Deliberately not listed: NEXT_PUBLIC_VERSION (a build arg; blank here would
# overwrite it), COMPOSE_FILE (only meant anything to the old compose setup).
# A new env key goes in .env, here, AND the stack Env.

x-env: &env
  API_LIMIT: ${API_LIMIT:-}
  BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-}
  BEEHIIVE_API_KEY: ${BEEHIIVE_API_KEY:-}
  BEEHIIVE_PUBLICATION_ID: ${BEEHIIVE_PUBLICATION_ID:-}
  DATABASE_URL: ${DATABASE_URL:-}
  DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-}
  DISCORD_BOT_TOKEN_ID: ${DISCORD_BOT_TOKEN_ID:-}
  DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
  DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
  DRIBBBLE_CLIENT_ID: ${DRIBBBLE_CLIENT_ID:-}
  DRIBBBLE_CLIENT_SECRET: ${DRIBBBLE_CLIENT_SECRET:-}
  FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
  FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
  FEE_AMOUNT: ${FEE_AMOUNT:-}
  FRONTEND_URL: ${FRONTEND_URL:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  GOOGLE_GMB_CLIENT_ID: ${GOOGLE_GMB_CLIENT_ID:-}
  GOOGLE_GMB_CLIENT_SECRET: ${GOOGLE_GMB_CLIENT_SECRET:-}
  INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
  INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
  IS_GENERAL: ${IS_GENERAL:-}
  JWT_SECRET: ${JWT_SECRET:-}
  LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
  LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
  LINKEDIN_PAGE_CLIENT_ID: ${LINKEDIN_PAGE_CLIENT_ID:-}
  LINKEDIN_PAGE_CLIENT_SECRET: ${LINKEDIN_PAGE_CLIENT_SECRET:-}
  MAIN_URL: ${MAIN_URL:-}
  MASTODON_CLIENT_ID: ${MASTODON_CLIENT_ID:-}
  MASTODON_CLIENT_SECRET: ${MASTODON_CLIENT_SECRET:-}
  MASTODON_URL: ${MASTODON_URL:-}
  NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-}
  NEXT_PUBLIC_DISCORD_SUPPORT: ${NEXT_PUBLIC_DISCORD_SUPPORT:-}
  NEXT_PUBLIC_POLOTNO: ${NEXT_PUBLIC_POLOTNO:-}
  NEXT_PUBLIC_UPLOAD_DIRECTORY: ${NEXT_PUBLIC_UPLOAD_DIRECTORY:-}
  NX_ADD_PLUGINS: ${NX_ADD_PLUGINS:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  PINTEREST_CLIENT_ID: ${PINTEREST_CLIENT_ID:-}
  PINTEREST_CLIENT_SECRET: ${PINTEREST_CLIENT_SECRET:-}
  REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
  REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
  REDIS_URL: ${REDIS_URL:-}
  RUN_CRON: ${RUN_CRON:-}
  SLACK_ID: ${SLACK_ID:-}
  SLACK_SECRET: ${SLACK_SECRET:-}
  SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:-}
  STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_SIGNING_KEY: ${STRIPE_SIGNING_KEY:-}
  STRIPE_SIGNING_KEY_CONNECT: ${STRIPE_SIGNING_KEY_CONNECT:-}
  TELEGRAM_BOT_NAME: ${TELEGRAM_BOT_NAME:-}
  TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
  TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-}
  THREADS_APP_ID: ${THREADS_APP_ID:-}
  THREADS_APP_SECRET: ${THREADS_APP_SECRET:-}
  TIKTOK_CLIENT_ID: ${TIKTOK_CLIENT_ID:-}
  TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
  UPLOAD_DIRECTORY: ${UPLOAD_DIRECTORY:-}
  X_API_KEY: ${X_API_KEY:-}
  X_API_SECRET: ${X_API_SECRET:-}
  YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
  YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}

services:
  postiz:
    # Rollback: set POSTIZ_IMAGE_TAG to an older short SHA in the stack Env and
    # redeploy (soul/rollback.sh).
    image: ghcr.io/sudipta26889/postiz-app:${POSTIZ_IMAGE_TAG:-latest}
    container_name: postiz
    restart: always
    # Override image CMD: 'pnpm dlx prisma@6.5.0' re-downloads prisma every boot
    # and hangs. Use the prisma already bundled in the image.
    command: sh -c "nginx && (pm2 delete all || true) && pnpm exec prisma db push --accept-data-loss --schema ./libraries/nestjs-libraries/src/database/prisma/schema.prisma && pnpm run --parallel pm2 && pm2 logs"
    environment: *env
    ports:
      - "4007:5000"
    volumes:
      - postiz-uploads:/uploads
    labels:
      - autoheal=true
    # Backend can die while PM2 still reports 'online'; probe the real :3000
    # listener so autoheal restarts the container.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/',r=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks:
      - postiz-network

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: postiz-autoheal
    restart: always
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: none

networks:
  postiz-network:

# External: holds user media (STORAGE_PROVIDER=local). The stack must attach to
# the existing volume, never create an empty one.
volumes:
  postiz-uploads:
    external: true
    name: postiz_postiz-uploads
