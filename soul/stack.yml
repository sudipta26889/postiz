# Production stack: a Git-backed Portainer stack on the NAS Portainer (endpoint 11
# = NUC). CI builds the image on push to main and fires the stack webhook.
#
# No env_file: Portainer Git stacks can't read one, so every env key is listed
# below as ${KEY:-} and its value lives in the stack Env.
#
# PROVISIONAL KEY LIST: derived from .env.example and the code's process.env
# reads, not from production's .env. Before cutover, run the comparison in
# soul/README.md and make this list exactly match production's keys: ${KEY:-}
# sets a missing key to "", which is not always the same as unset.
#
# Deliberately not listed: NEXT_PUBLIC_VERSION (a build arg; blank here would
# overwrite it), COMPOSE_FILE (only meant anything to the old compose setup).
# A new env key goes in .env, here, AND the stack Env.

