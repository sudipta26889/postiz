services:
  postiz:
    image: postiz-app:soul-20260903
    container_name: postiz
    restart: always
    # Override image CMD: `pnpm dlx prisma@6.5.0` re-downloads prisma every boot and
    # hangs — use the prisma already bundled in the image (see memory 2026-06-29).
    command: sh -c "nginx && (pm2 delete all || true) && pnpm exec prisma db push --accept-data-loss --schema ./libraries/nestjs-libraries/src/database/prisma/schema.prisma && pnpm run --parallel pm2 && pm2 logs"
    env_file: .env
    ports:
      - "4007:5000"
    volumes:
      - ./config:/config
      - postiz-uploads:/uploads
    labels:
      - autoheal=true
    # Backend can die while PM2 still reports "online"; probe the real :3000 listener
    # so autoheal restarts the container (unhealthy after start_period + 3 failures).
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/',r=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks:
      - postiz-network

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: postiz-autoheal
    restart: always
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: none

networks:
  postiz-network:

volumes:
  postiz-uploads:
